# Do not attach a rate limit to the web or websecure entrypoints.
#
# An entrypoint middleware runs for every host. The old overlay set:
#
#   --entryPoints.web.http.middlewares=traefik-v2-bot-defense@kubernetescrd
#   --entryPoints.websecure.http.middlewares=traefik-v2-bot-defense@kubernetescrd
#
# That chain was 60 requests/minute, burst 20, and 8 in flight per client IP.
# One gallery open spends the burst. A venue Wi-Fi is one public IP for
# hundreds of phones, so the same bucket 429s the whole room.
#
# Scanner-path 403s live in bot-defense.yaml (kubectl apply), not in Helm.
# Per-app limits live in templates/ and are attached on that Ingress only.
#
# This file is intentionally empty. Passing it on a --reset-values upgrade
# does not put the chain back. A --reuse-values upgrade keeps whatever
# additionalArguments the release already has; use the detach command in the
# README to clear an already-installed chain.
