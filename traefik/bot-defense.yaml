# Cluster-wide scanner-path drop (k3s / traefik-v2).
#
#   kubectl apply -f bot-defense.yaml
#
# High-priority IngressRoutes return 403 for probe paths and never hit app pods.
# This file does not rate-limit. A limit on the shared web/websecure entrypoints
# applies to every host, and one public IP at a venue is hundreds of people.
# Copy templates/ratelimit-site.yaml or templates/ratelimit-venue.yaml into the
# app namespace and attach it on that Ingress only.
#
# Real client IPs require service.spec.externalTrafficPolicy: Local
# (values.cluster.yaml). Do not set ipStrategy.depth — MetalLB is not an HTTP hop.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: reject-forbidden
  namespace: traefik-v2
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: bot-defense
spec:
  # Nobody is in this range, so every request on routers that use this
  # middleware is refused before the dummy sink service.
  ipAllowList:
    sourceRange:
      - 255.255.255.255/32
    rejectStatusCode: 403
---
# Dummy backend. reject-forbidden always 403s first, so this is never called.
apiVersion: v1
kind: Service
metadata:
  name: scanner-sink
  namespace: traefik-v2
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: bot-defense
spec:
  ports:
    - name: http
      port: 9
      targetPort: 9
---
# Paths taken from live Traefik access logs (credential dumps, phpinfo, WP).
# Do not include real app routes such as /auth/login or /api/auth.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scanner-drop-http
  namespace: traefik-v2
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: bot-defense
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathRegexp(`(?i)(?:^|/)\.env`) || PathRegexp(`(?i)(?:^|/)\.git`) || PathPrefix(`/.aws`) || PathPrefix(`/.docker`) || PathPrefix(`/.kube`) || Path(`/.pypirc`) || Path(`/.npmrc`) || Path(`/.git-credentials`) || PathPrefix(`/%2F`) || Path(`/xmlrpc.php`) || Path(`/wp-login.php`) || PathPrefix(`/wp-admin`) || PathPrefix(`/wordpress`) || PathPrefix(`/wp/`) || Path(`/wp`) || PathRegexp(`(?i)(?:^|/)(?:phpinfo|_?phpinfo|php-info|php_info|info|pi|i)\.php$`) || PathPrefix(`/actuator`) || Path(`/server-status`) || Path(`/debug/vars`)
      priority: 1000000
      middlewares:
        - name: reject-forbidden
      services:
        - name: scanner-sink
          port: 9
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scanner-drop-https
  namespace: traefik-v2
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: bot-defense
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: PathRegexp(`(?i)(?:^|/)\.env`) || PathRegexp(`(?i)(?:^|/)\.git`) || PathPrefix(`/.aws`) || PathPrefix(`/.docker`) || PathPrefix(`/.kube`) || Path(`/.pypirc`) || Path(`/.npmrc`) || Path(`/.git-credentials`) || PathPrefix(`/%2F`) || Path(`/xmlrpc.php`) || Path(`/wp-login.php`) || PathPrefix(`/wp-admin`) || PathPrefix(`/wordpress`) || PathPrefix(`/wp/`) || Path(`/wp`) || PathRegexp(`(?i)(?:^|/)(?:phpinfo|_?phpinfo|php-info|php_info|info|pi|i)\.php$`) || PathPrefix(`/actuator`) || Path(`/server-status`) || Path(`/debug/vars`)
      priority: 1000000
      middlewares:
        - name: reject-forbidden
      services:
        - name: scanner-sink
          port: 9
  tls: {}
