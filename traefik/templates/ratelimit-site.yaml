# One visitor per public IP (home or cellular). Copy into the app namespace
# and replace every "app" below. Do not apply this file from traefik/.
#
# Do not use this where hundreds of people share a network. They share one
# public IP, so this bucket 429s the room. Use ratelimit-venue.yaml instead.
#
# 60 requests/minute, burst 20, 8 in flight. Over-limit responses are HTTP 429.
# Buckets key off the TCP client address. That is the visitor only when
# externalTrafficPolicy is Local. Leave ipStrategy.depth unset.
#
# Ingress annotation (same namespace; cross-namespace refs are off):
#
#   traefik.ingress.kubernetes.io/router.middlewares: app-site-ratelimit@kubernetescrd
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: per-ip-ratelimit
  namespace: app
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 20
    sourceCriterion:
      ipStrategy: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: per-ip-inflight
  namespace: app
spec:
  inFlightReq:
    amount: 8
    sourceCriterion:
      ipStrategy: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: site-ratelimit
  namespace: app
spec:
  chain:
    middlewares:
      - name: per-ip-ratelimit
      - name: per-ip-inflight
