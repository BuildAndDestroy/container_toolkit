# Cluster / MetalLB settings for Traefik Helm chart 41+.
#
# Chart 41 renamed logs.access → accessLog and requires providers.file.content
# as an object ({}). 40.x stored those as logs: and content: "".
#
# Fresh install / 41.x patch:
#   helm upgrade --install traefik traefik/traefik \
#     --namespace traefik-v2 \
#     --values values.cluster.yaml
#
# 40 → 41 (one time): do not --reuse-values. That re-injects the old keys.
#   helm upgrade traefik traefik/traefik \
#     --namespace traefik-v2 \
#     --reset-values \
#     --values values.cluster.yaml
#
# Do not pass an overlay that sets entrypoint middlewares. Rate limits are
# per Ingress (templates/). Scanner drops are kubectl apply -f bot-defense.yaml.

# Visitor request logs (ClientAddr = real client IP when traffic policy is Local)
accessLog:
  enabled: true

# Override leftover 40.x string default if a values merge still carries it.
providers:
  file:
    content: {}

# Preserve client source IPs through the LoadBalancer (MetalLB L2).
# Without this, access logs show a node IP instead of the visitor.
service:
  spec:
    externalTrafficPolicy: Local
