apiVersion: v1
kind: Namespace
metadata:
  name: docker-registry-ns
---
apiVersion: v1
stringData:
  # Replace: htpasswd -Bbn registry YOUR_PASSWORD
  htpasswd: registry:CHANGEME
kind: Secret
metadata:
  name: docker-registry-htpasswd
  namespace: docker-registry-ns
type: Opaque
---
# Create PersistentVolume
# Set your NFS server IP/hostname and exported path below.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: docker-registry-storage-pv
  labels:
    type: nfs
spec:
  storageClassName: manual
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: nfs.example.local
    path: /exports/docker-registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docker-registry-storage-pvc
  namespace: docker-registry-ns
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: docker-registry-ns
  labels:
    app: docker-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry
  template:
    metadata:
      labels:
        app: docker-registry
    spec:
      containers:
      - name: docker-registry
        image: registry
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: docker-registry-storage-pv
          mountPath: /var/lib/registry
        - name: htpasswd
          mountPath: /mnt/kubernetes/docker-registry/auth
          readOnly: true
        env:
        - name: REGISTRY_AUTH
          value: htpasswd
        - name: REGISTRY_AUTH_HTPASSWD_REALM
          value: Docker Registry
        - name: REGISTRY_AUTH_HTPASSWD_PATH
          value: /mnt/kubernetes/docker-registry/auth/htpasswd
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
      volumes:
      - name: docker-registry-storage-pv
        persistentVolumeClaim:
            claimName: docker-registry-storage-pvc
      - name: htpasswd
        secret:
          secretName: docker-registry-htpasswd
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: docker-registry-service
  namespace: docker-registry-ns
spec:
  selector:
    app: docker-registry
  ports:
    - protocol: TCP
      port: 5000
---
#apiVersion: extensions/v1beta1
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry-ingress
  namespace: docker-registry-ns
  annotations:
    #cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # HTTPS only. Without an entrypoints annotation Traefik serves this Ingress
    # on web (port 80) too, so registry logins and pushes go over plain HTTP.
    # Port 80 is handled by docker-registry-http-redirect below.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: docker-registry-ns-per-ip-ratelimit@kubernetescrd
spec:
  ingressClassName: "traefik"
  rules:
  - host: registry.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-registry-service
            port:
              number: 5000
  tls:
  - hosts:
    - registry.yourdomain.com
    secretName: docker-registry-tls
---
# Port 80 -> 301 to https. Only the redirect runs on this router.
# cert-manager HTTP-01 still works: its solver Ingress uses the longer
# /.well-known/acme-challenge/ path, and Let's Encrypt follows redirects.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: docker-registry-ns
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry-http-redirect
  namespace: docker-registry-ns
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: docker-registry-ns-redirect-https@kubernetescrd
spec:
  ingressClassName: "traefik"
  rules:
  - host: registry.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-registry-service
            port:
              number: 5000
---
# Registry pushes, not the site or venue templates.
# A docker push opens many requests at once (one per layer). The site profile
# (60/minute, burst 20) returns 429 on that. The venue profile is for a room
# full of phones on one Wi-Fi. See traefik/templates/ratelimit-registry.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: per-ip-ratelimit
  namespace: docker-registry-ns
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 100
    sourceCriterion:
      ipStrategy: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-ingressroute
  namespace: docker-registry-ns
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.yourdomain.com`)
      kind: Rule
      middlewares:
        - name: per-ip-ratelimit
      services:
        - name: docker-registry-service
          port: 5000
  tls:
    certResolver: letsencrypt
